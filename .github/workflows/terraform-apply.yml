name: Terraform Apply (AKS prod)

on:
  push:
    branches: [main]
    paths:
      - "environments/prod/**"
      - "modules/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # required for Azure OIDC login
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  # Force the backend onto Azure AD (data-plane OAuth) rather than shared keys.
  # backend.hcl already sets use_azuread_auth, but the state storage account has
  # shared_access_key_enabled = false, so a silent fallback to key-based auth
  # fails with a 403 AuthenticationFailed that is hard to read.
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
  WORKING_DIR: environments/prod

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The azurerm backend (unlike the azurerm provider) doesn't auto-detect
      # GitHub Actions OIDC, so it needs the runner's ID token request
      # token/URL explicitly, aliased to the ARM_OIDC_* names it looks for.
      - name: Export OIDC token vars for Terraform backend
        run: |
          echo "ARM_OIDC_REQUEST_TOKEN=$ACTIONS_ID_TOKEN_REQUEST_TOKEN" >> "$GITHUB_ENV"
          echo "ARM_OIDC_REQUEST_URL=$ACTIONS_ID_TOKEN_REQUEST_URL" >> "$GITHUB_ENV"

      # Reproduces the exact call `terraform init` makes against the state
      # container, but via the CLI, which reports the real Azure error code
      # instead of the backend's opaque "AuthenticationFailed" wrapper.
      - name: Preflight - verify backend variables and state container access
        env:
          SA: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
          RG: ${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}
          CONTAINER: ${{ vars.TFSTATE_CONTAINER_NAME }}
        run: |
          missing=0
          for v in SA RG CONTAINER; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository variable behind $v is empty. Define TFSTATE_STORAGE_ACCOUNT_NAME, TFSTATE_RESOURCE_GROUP_NAME and TFSTATE_CONTAINER_NAME under Settings > Secrets and variables > Actions > *Variables* (not Secrets)."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          echo "Authenticated as:"
          az ad signed-in-user show --query id -o tsv 2>/dev/null \
            || az account show --query "user.name" -o tsv

          echo "Listing blobs in ${SA}/${CONTAINER} using Azure AD auth:"
          az storage blob list \
            --auth-mode login \
            --account-name "$SA" \
            --container-name "$CONTAINER" \
            --num-results 1 \
            -o table

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="backend.hcl" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER_NAME }}"

      - name: Terraform validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan -no-color -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod-apply-${{ github.run_id }}
          path: ${{ env.WORKING_DIR }}/tfplan
          retention-days: 5

  apply:
    name: Apply
    needs: plan
    runs-on: ubuntu-latest
    # Configure a "production" Environment in repo Settings with required
    # reviewers so this job pauses for manual approval before applying.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The azurerm backend (unlike the azurerm provider) doesn't auto-detect
      # GitHub Actions OIDC, so it needs the runner's ID token request
      # token/URL explicitly, aliased to the ARM_OIDC_* names it looks for.
      - name: Export OIDC token vars for Terraform backend
        run: |
          echo "ARM_OIDC_REQUEST_TOKEN=$ACTIONS_ID_TOKEN_REQUEST_TOKEN" >> "$GITHUB_ENV"
          echo "ARM_OIDC_REQUEST_URL=$ACTIONS_ID_TOKEN_REQUEST_URL" >> "$GITHUB_ENV"

      # Reproduces the exact call `terraform init` makes against the state
      # container, but via the CLI, which reports the real Azure error code
      # instead of the backend's opaque "AuthenticationFailed" wrapper.
      - name: Preflight - verify backend variables and state container access
        env:
          SA: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
          RG: ${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}
          CONTAINER: ${{ vars.TFSTATE_CONTAINER_NAME }}
        run: |
          missing=0
          for v in SA RG CONTAINER; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository variable behind $v is empty. Define TFSTATE_STORAGE_ACCOUNT_NAME, TFSTATE_RESOURCE_GROUP_NAME and TFSTATE_CONTAINER_NAME under Settings > Secrets and variables > Actions > *Variables* (not Secrets)."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          echo "Authenticated as:"
          az ad signed-in-user show --query id -o tsv 2>/dev/null \
            || az account show --query "user.name" -o tsv

          echo "Listing blobs in ${SA}/${CONTAINER} using Azure AD auth:"
          az storage blob list \
            --auth-mode login \
            --account-name "$SA" \
            --container-name "$CONTAINER" \
            --num-results 1 \
            -o table

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="backend.hcl" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER_NAME }}"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod-apply-${{ github.run_id }}
          path: ${{ env.WORKING_DIR }}

      - name: Terraform apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -auto-approve tfplan
