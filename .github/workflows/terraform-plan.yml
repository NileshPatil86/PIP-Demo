name: Terraform Plan (AKS prod)

on:
  pull_request:
    branches: [main]
    paths:
      - "environments/prod/**"
      - "modules/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write # required for Azure OIDC login
  contents: read
  pull-requests: write # required to post the plan as a PR comment

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  # Force the backend onto Azure AD (data-plane OAuth) rather than shared keys.
  # backend.hcl already sets use_azuread_auth, but the state storage account has
  # shared_access_key_enabled = false, so a silent fallback to key-based auth
  # fails with a 403 AuthenticationFailed that is hard to read.
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
  WORKING_DIR: environments/prod

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The azurerm backend (unlike the azurerm provider) doesn't auto-detect
      # GitHub Actions OIDC, so it needs the runner's ID token request
      # token/URL explicitly, aliased to the ARM_OIDC_* names it looks for.
      - name: Export OIDC token vars for Terraform backend
        run: |
          echo "ARM_OIDC_REQUEST_TOKEN=$ACTIONS_ID_TOKEN_REQUEST_TOKEN" >> "$GITHUB_ENV"
          echo "ARM_OIDC_REQUEST_URL=$ACTIONS_ID_TOKEN_REQUEST_URL" >> "$GITHUB_ENV"

      # Reproduces the exact call `terraform init` makes against the state
      # container, but via the CLI, which reports the real Azure error code
      # instead of the backend's opaque "AuthenticationFailed" wrapper.
      - name: Preflight - verify backend variables and state container access
        env:
          SA: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
          RG: ${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}
          CONTAINER: ${{ vars.TFSTATE_CONTAINER_NAME }}
        run: |
          missing=0
          for v in SA RG CONTAINER; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository variable behind $v is empty. Define TFSTATE_STORAGE_ACCOUNT_NAME, TFSTATE_RESOURCE_GROUP_NAME and TFSTATE_CONTAINER_NAME under Settings > Secrets and variables > Actions > *Variables* (not Secrets)."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          echo "== Signed-in context =="
          az account show --query "{subscriptionId:id, tenantId:tenantId, name:name}" -o yaml

          echo "== Storage token claims (issuer / audience / tenant) =="
          payload=$(az account get-access-token --resource https://storage.azure.com/ \
            --query accessToken -o tsv | cut -d. -f2)
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          printf '%s' "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq '{iss, aud, tid, appid}'

          # Storage account names are GLOBALLY unique. If the account was never
          # created in this subscription, DNS can still resolve the name to some
          # other tenant's account - which fails with exactly
          # "Issuer validation failed. Issuer did not match."
          echo "== Does ${SA} exist in this subscription? =="
          if sa_id=$(az storage account show --name "$SA" --resource-group "$RG" \
                       --query id -o tsv 2>/tmp/sa_err.txt); then
            echo "Found: $sa_id"
          else
            cat /tmp/sa_err.txt
            if grep -q "AuthorizationFailed" /tmp/sa_err.txt; then
              echo "::error::The GitHub Actions identity cannot even read '$RG' in this subscription, so its role assignments are missing. Apply the bootstrap/ stack as a subscription Owner - it creates the state storage account plus the Contributor and Storage Blob Data Contributor assignments."
            else
              echo "::error::Storage account '$SA' does not exist in resource group '$RG'. Storage account names are globally unique, so requests are currently reaching an account in a DIFFERENT tenant. Apply the bootstrap/ stack and set TFSTATE_* from its outputs."
            fi
            exit 1
          fi

          echo "Listing blobs in ${SA}/${CONTAINER} using Azure AD auth:"
          az storage blob list \
            --auth-mode login \
            --account-name "$SA" \
            --container-name "$CONTAINER" \
            --num-results 1 \
            -o table

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive
        working-directory: .

      - name: Terraform init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="backend.hcl" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER_NAME }}"

      - name: Terraform validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Upload plan artifact
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod-${{ github.event.pull_request.number }}
          path: ${{ env.WORKING_DIR }}/tfplan
          retention-days: 5

      - name: Render plan text for PR comment
        if: always()
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform show -no-color tfplan > plan.txt || echo "No plan output available." > plan.txt

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const planPath = path.join(process.env.WORKING_DIR, 'plan.txt');
            let planOutput = 'No plan output available.';
            try {
              planOutput = fs.readFileSync(planPath, 'utf8');
            } catch (e) {}
            const maxLen = 60000;
            if (planOutput.length > maxLen) {
              planOutput = planOutput.substring(0, maxLen) + '\n... (truncated)';
            }
            const outcome = '${{ steps.plan.outcome }}';
            const body = [
              `#### Terraform Plan (prod): \`${outcome}\``,
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              planOutput,
              '```',
              '</details>',
              '',
              `*Pushed by @${{ github.actor }} — commit ${{ github.sha }}*`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '#### Terraform Plan (prod):';
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
